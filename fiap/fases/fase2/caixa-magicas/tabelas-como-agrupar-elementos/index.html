<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas-como-agrupar-elementos</title>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow&family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Meu Projeto Web</h1>

    <table border="1">
      <thead>
        <!-- Linha da tablea -->
        <tr>
          <th>Nome do Herói</th>
          <th>Velocidade</th>
          <th>Agilidade</th>
          <th>Força</th>
          <th>XP</th>
        </tr>
        <!-- Fim Linha da tablea -->
      </thead>

      <tbody>
        <!-- 1º - Herói -->
        <tr>
          <td>SuperMan</td>
          <td>70</td>
          <td>85</td>
          <td>95</td>
          <td>99</td>
        </tr>
        <!-- Fim 1º - Herói -->

        <!-- 2º - Herói -->
        <tr>
          <td>Mulher Maravilha</td>
          <td>75</td>
          <td>80</td>
          <td>90</td>
          <td>96</td>
        </tr>
        <!-- Fim 2º - Herói -->

        <!-- 3º - Herói -->
        <tr>
          <td>Homem Aranha</td>
          <td>90</td>
          <td>95</td>
          <td>80</td>
          <td>100</td>
        </tr>
        <!-- Fim 3º - Herói -->
      </tbody>

      <tfoot>
        <tr>
          <td colspan="5">Dados atualizados no 1º. Semestre</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
