<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas-tags-basicas</title>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow&family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Meu projeto web</h1>

    <!-- Inicio da tabela -->
    <table>
      <!-- 1a. linha da tabela -->
      <tr>
        <th>Nome do Herói</th>
        <th>Velocidade</th>
        <th>Agilidade</th>
        <th>Força</th>
        <th>XP</th>
      </tr>
      <!-- Fim 1a. linha da tabela -->

      <!-- 1o.Herói -->
      <tr>
        <td>Super Man</td>
        <td>94</td>
        <td>96</td>
        <td>99</td>
        <td>98</td>
      </tr>
      <!-- Fim 1o.Herói -->

      <!-- 2o.Herói -->
      <tr>
        <td>Mulher Maravilha</td>
        <td>92</td>
        <td>95</td>
        <td>97</td>
        <td>96</td>
      </tr>
      <!-- Fim 2o.Herói -->

      <!-- 3o.Herói -->
      <tr>
        <td>Homem Aranha</td>
        <td>89</td>
        <td>99</td>
        <td>92</td>
        <td>93</td>
      </tr>
      <!-- Fim 3o.Herói -->
    </table>
    <!-- Fim da tabela -->
  </body>
</html>
