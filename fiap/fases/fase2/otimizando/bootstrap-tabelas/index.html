<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bootstrap-tabelas</title>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow&family=Catamaran:wght@100..900&family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Link -->

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container my-5">
      <table class="table table-striped table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>Banda</th>
            <th>Data Show</th>
            <th>Local</th>
            <th>Ingresso Premium</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Tame Impala</td>
            <td>12/08</td>
            <td>São Paulo</td>
            <td>1.200,00</td>
          </tr>
          <tr>
            <td>Limp Bizkit</td>
            <td>04/05</td>
            <td>Brasília</td>
            <td>700,00</td>
          </tr>
          <tr>
            <td>Foo Fighters</td>
            <td>02/03</td>
            <td>Rio de Janeiro</td>
            <td>950,00</td>
          </tr>
          <tr>
            <td>Red Hot Chilli Peppers</td>
            <td>10/10</td>
            <td>Belo Horizonte</td>
            <td>1.150,00</td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Bootstrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
