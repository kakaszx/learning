<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Projeto Web</title>
    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="bg-danger py-4">
      <h1 class="display-3 text-light text-center">E-Show</h1>
    </header>

    <main class="container">
      <!-- Cadastrar Show -->
      <section class="border border-1 rounded-1 my-5 p-4">
        <h2 class="display-5">Cadastrar Show</h2>
        <form class="dados" id="dados" method="post" action="">
          <div class="row mb-3">
            <div class="col-md-4 my-3">
              <!-- Artista/Banda -->
              <label for="artista" class="form-label">Artista/Banda</label>
              <input
                type="text"
                class="form-control"
                id="artista"
                name="artista"
                placeholder="Ex: Led Zeppelin"
                required
              />
            </div>
            <!-- Data do Show -->
            <div class="col-md-4 my-3">
              <label for="dataShow" class="form-label">Data do Show</label>
              <input
                type="datetime-local"
                class="form-control"
                id="dataShow"
                name="dataShow"
                required
              />
            </div>
            <!-- Cidade -->
            <div class="col-md-4 my-3">
              <label for="cidade" class="form-label">Cidade</label>
              <input
                type="text"
                class="form-control"
                id="cidade"
                name="Cidade"
                placeholder="Ex: São Paulo"
                required
              />
            </div>

            <!-- Local do Show -->
            <div class="col-md-4 my-3">
              <label for="localShow" class="form-label">Local do Show</label>
              <input
                type="text"
                class="form-control"
                id="localShow"
                name="localShow"
                placeholder="Ex: Allianz Park"
                required
              />
            </div>

            <!-- Valor médio do Ingresso -->
            <div class="col-md-4 my-3">
              <label for="mediaIngresso" class="form-label"
                >Valor médio do Ingresso</label
              >
              <input
                type="text"
                class="form-control"
                id="mediaIngresso"
                name="mediaIngresso"
                placeholder="Ex: 345.60"
                required
              />
            </div>
            <!-- Banner -->
            <div class="col-md-4 my-3">
              <label for="banner" class="form-label">Banner</label>
              <input
                type="file"
                class="form-control"
                id="banner"
                name="banner"
                required
              />
            </div>
            <!-- Cadastrar Show -->
            <div class="d-flex justify-content-end mt-4">
              <button type="submit" class="btn btn-danger">
                Cadastrar Show >>
              </button>
            </div>
          </div>
        </form>
      </section>
      <!-- Próximos shows -->
      <section class="border border-1 rounded-1 my-5 p-4">
        <h2 class="display-5">Próximos shows</h2>
        <table
          id="resumo"
          class="table table-custom-danger text-center align-middle"
        >
          <thead>
            <tr id="cabecalho center">
              <th class="artista">Nome banda/artista</th>
              <th class="data-show">Data do Show</th>
              <th class="cidade">Cidade</th>
              <th class="local">Local</th>
              <th class="preco">Media Preço</th>
              <th class="foto">Banner Tour</th>
            </tr>
          </thead>
          <tbody class="shows"></tbody>
        </table>
      </section>
      <!-- Compre seus ingressos -->
      <section class="border border-1 rounded-1 my-5 p4">
        <h2 class="display-5">Compre seus ingressos</h2>
        <div class="row cards-show text-center"></div>
      </section>
    </main>

    <!-- Bootstrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
